<!doctype html>
<meta charset="utf-8">
<title>broken fixture</title>
<h1>Broken WebMCP fixture</h1>
<script>
  const mc = document.modelContext ?? navigator.modelContext;
  fetch(`/env?zone=${encodeURIComponent(Intl.DateTimeFormat().resolvedOptions().timeZone)}&lang=${navigator.language}`);
  const ro = { readOnlyHint: true };
  const register = (tool) => mc.registerTool(tool).catch((err) => console.error("register failed", tool.name, err));

  register({
    name: "jump_tool",
    description: "Opens the page with the latest news. Declared read-only, but it navigates away from the current page.",
    inputSchema: { type: "object", properties: {} },
    annotations: ro,
    execute: async () => { location.href = "/elsewhere"; return { opened: true }; },
  });

  register({
    name: "get_time",
    description: "Returns the current server time for the visitor as an ISO 8601 string.",
    inputSchema: { type: "object", properties: {} },
    annotations: ro,
    execute: async () => ({ now: new Date().toISOString() }),
  });

  register({
    name: "nullish",
    description: "Looks up a product by id and returns its price, which is null when the product has no price yet.",
    inputSchema: { type: "object", properties: { id: { type: "string", description: "The product id, for example p-100." } }, required: ["id"] },
    annotations: ro,
    execute: async () => ({ price: null }),
  });

  register({
    name: "liar",
    description: "Reads the visitor's wishlist. Declared read-only, but it posts a tracking event while it runs.",
    inputSchema: { type: "object", properties: {} },
    annotations: ro,
    execute: async () => { await fetch("/track", { method: "POST", body: "{}" }); return { items: [] }; },
  });

  register({
    name: "unfinished",
    description: "Filters the catalogue. Its schema lists a required parameter that does not exist and a parameter without a description.",
    inputSchema: { type: "object", properties: { colour: { type: "string" } }, required: ["size"] },
    execute: async () => ({ ok: true }),
  });

  register({
    name: "send_report",
    description: "Sends the daily report by email to the visitor. Wrongly declared read-only.",
    inputSchema: { type: "object", properties: {} },
    annotations: ro,
    execute: async () => { await fetch("/send", { method: "POST", body: "{}" }); return { sent: true }; },
  });

  register({
    name: "gql_reader",
    description: "Reads the shop name through a GraphQL query sent by POST, the way storefront APIs do.",
    inputSchema: { type: "object", properties: {} },
    annotations: ro,
    execute: async () => { await fetch("/graphql", { method: "POST", body: JSON.stringify({ query: "query { shop { name } }" }) }); return { name: "fixture" }; },
  });

  register({
    name: "gql_writer",
    description: "Declared read-only, but it sends a GraphQL mutation that creates a cart.",
    inputSchema: { type: "object", properties: {} },
    annotations: ro,
    execute: async () => { await fetch("/graphql", { method: "POST", body: JSON.stringify({ query: "mutation { cartCreate { cart { id } } }" }) }); return { id: "c1" }; },
  });

  register({
    name: "hang_tool",
    description: "Looks up a delivery estimate but never answers, the way a stalled backend call would.",
    inputSchema: { type: "object", properties: { postcode: { type: "string", description: "The postcode to estimate for." } } },
    annotations: ro,
    execute: () => new Promise(() => {}),
  });

  setTimeout(() => register({
    name: "late_tool",
    description: "Registered one second after the page loaded, the way a hydrated widget would do it.",
    inputSchema: { type: "object", properties: {} },
    annotations: ro,
    execute: async () => ({ late: true }),
  }), 1000);
</script>
