  <line class="grid" x1="80" x2="680" y1="241" y2="241"/>
  <text class="muted" x="70" y="245" text-anchor="end">60%</text>
  <line class="grid" x1="80" x2="680" y1="182" y2="182"/>
  <text class="muted" x="70" y="186" text-anchor="end">70%</text>
  <line class="grid" x1="80" x2="680" y1="123" y2="123"/>
  <text class="muted" x="70" y="127" text-anchor="end">80%</text>
  <line class="grid" x1="80" x2="680" y1="64" y2="64"/>
  <text class="muted" x="70" y="68" text-anchor="end">90%</text>
  <line class="ref" x1="80" x2="680" y1="192.03000000000003" y2="192.03000000000003"/>
  <text class="muted" x="680" y="186.03000000000003" text-anchor="end">all sites 68.3%</text>
  <circle class="dot" cx="130" cy="142.46999999999997" r="6"/>
  <text class="value" x="130" y="128.46999999999997" text-anchor="middle">76.7%</text>
  <text class="label" x="130" y="324" text-anchor="middle">A+</text>
  <text class="muted" x="130" y="342" text-anchor="middle">24 sites</text>
  <circle class="dot" cx="230" cy="114.15" r="6"/>
  <text class="value" x="230" y="100.15" text-anchor="middle">81.5%</text>
  <text class="label" x="230" y="324" text-anchor="middle">A</text>
  <text class="muted" x="230" y="342" text-anchor="middle">56 sites</text>
  <circle class="dot" cx="330" cy="156.63000000000002" r="6"/>
  <text class="value" x="330" y="142.63000000000002" text-anchor="middle">74.3%</text>
  <text class="label" x="330" y="324" text-anchor="middle">B</text>
