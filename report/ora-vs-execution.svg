<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 364" width="720" height="364" role="img" aria-labelledby="t d">
  <title id="t">Ora grade against the share of executed tools that pass</title>
  <desc id="d">Pass rate of executed read-only tools per Ora grade, for sites with tools and a cached Ora score. Source: data/summary.json by_ora_grade.</desc>
  <style>
    .surface { fill: #fcfcfb; }
    .mark { fill: #2a78d6; }
    .dot { fill: #2a78d6; stroke: #fcfcfb; stroke-width: 2; }
    .grid { stroke: #e6e5e1; stroke-width: 1; }
    .ref { stroke: #52514e; stroke-width: 1; stroke-dasharray: 4 4; }
    .title { fill: #0b0b0b; font: 600 15px system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .label { fill: #0b0b0b; font: 13px system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .value { fill: #0b0b0b; font: 600 13px system-ui, -apple-system, 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums; }
    .muted { fill: #52514e; font: 12px system-ui, -apple-system, 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; }
      .mark { fill: #3987e5; }
      .dot { fill: #3987e5; stroke: #1a1a19; }
      .grid { stroke: #333331; }
      .ref { stroke: #c3c2b7; }
      .title, .label, .value { fill: #ffffff; }
      .muted { fill: #c3c2b7; }
    }
  </style>
  <rect class="surface" width="720" height="364" rx="8"/>
  <text class="title" x="24" y="32">Ora grade against the share of executed tools that pass</text>
  <line class="grid" x1="80" x2="680" y1="300" y2="300"/>
